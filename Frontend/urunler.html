<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RetailStock — Ürünler</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a12;--surface:rgba(255,255,255,0.035);--border:rgba(255,255,255,0.06);--text:#fffffe;--text-dim:rgba(255,255,255,0.45);--text-muted:rgba(255,255,255,0.25);--purple:#7f5af0;--purple-glow:rgba(127,90,240,0.35);--green:#2cb67d;}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
body::before{content:'';position:fixed;top:-200px;right:-200px;width:600px;height:600px;background:radial-gradient(circle,rgba(127,90,240,0.08) 0%,transparent 70%);pointer-events:none;}
.top-nav{display:flex;align-items:center;justify-content:space-between;padding:12px 28px;background:rgba(10,10,18,0.75);backdrop-filter:blur(24px);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100;}
.back-link{display:inline-flex;align-items:center;gap:6px;color:var(--text-dim);text-decoration:none;font-size:13px;font-weight:500;padding:8px 16px;border-radius:10px;background:var(--surface);border:1px solid var(--border);transition:all .3s;overflow:hidden;position:relative;}
.back-link::after{content:'';position:absolute;inset:0;opacity:0;transition:opacity .3s;background:radial-gradient(circle at center,rgba(255,255,255,0.1) 0%,transparent 70%);}
.back-link:hover{color:var(--purple);border-color:rgba(127,90,240,0.3);background:rgba(127,90,240,0.08);}
.back-link:hover::after{opacity:1;}
.nav-brand{font-size:17px;font-weight:700;background:linear-gradient(135deg,var(--purple),var(--green));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.count-badge{font-size:12px;color:var(--text-muted);padding:6px 14px;border-radius:20px;background:var(--surface);border:1px solid var(--border);}
.hero{text-align:center;padding:48px 20px 16px;position:relative;z-index:1;}
.hero h1{font-size:34px;font-weight:800;letter-spacing:-.5px;margin-bottom:6px;}
.hero p{color:var(--text-muted);font-size:14px;}
.search-wrap{display:flex;justify-content:center;padding:20px 20px 10px;position:relative;z-index:1;}
.search-box{position:relative;width:100%;max-width:480px;}
.search-box input{width:100%;padding:13px 18px 13px 42px;background:var(--surface);border:1px solid var(--border);border-radius:12px;color:var(--text);font-family:'Inter',sans-serif;font-size:14px;outline:none;transition:all .3s;}
.search-box input::placeholder{color:var(--text-muted);}
.search-box input:focus{border-color:var(--purple);box-shadow:0 0 0 3px rgba(127,90,240,0.1);}
.search-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:15px;opacity:.35;}
.stats{display:flex;justify-content:center;gap:40px;padding:20px 20px 28px;position:relative;z-index:1;}
.stat{text-align:center;}
.stat-val{font-size:26px;font-weight:800;color:var(--purple);}
.stat-lbl{font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.8px;margin-top:2px;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:20px;padding:0 28px 60px;max-width:1300px;margin:0 auto;position:relative;z-index:1;}
.card{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:18px;transition:all .4s cubic-bezier(.4,0,.2,1);position:relative;overflow:hidden;cursor:default;}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--purple),var(--green));transform:scaleX(0);transition:transform .4s cubic-bezier(.4,0,.2,1);transform-origin:left;}
.card:hover{transform:translateY(-6px);border-color:rgba(127,90,240,0.2);box-shadow:0 24px 48px rgba(0,0,0,0.35);}
.card:hover::before{transform:scaleX(1);}
.card-img{width:100%;height:175px;border-radius:14px;overflow:hidden;background:rgba(255,255,255,0.02);display:flex;align-items:center;justify-content:center;margin-bottom:14px;}
.card-img img{max-width:88%;max-height:88%;object-fit:contain;transition:transform .5s cubic-bezier(.4,0,.2,1);}
.card:hover .card-img img{transform:scale(1.1);}
.card-name{font-size:14px;font-weight:600;line-height:1.4;margin-bottom:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.card-meta{font-size:11px;color:var(--text-muted);margin-bottom:2px;}
.card-meta span{color:var(--text-dim);}
.card-price{font-size:20px;font-weight:800;color:var(--green);margin-top:10px;}
.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:80px;gap:14px;}
.spinner{width:38px;height:38px;border:3px solid rgba(127,90,240,0.15);border-top-color:var(--purple);border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.empty{text-align:center;padding:80px 20px;color:var(--text-muted);}
.empty .icon{font-size:52px;margin-bottom:14px;}
</style>
</head>
<body>
<nav class="top-nav">
    <a href="anasayfa.html" class="back-link">← Panele Dön</a>
    <span class="nav-brand">RetailStock</span>
    <span class="count-badge" id="productCount"></span>
</nav>
<div class="hero"><h1>Ürün Kataloğu</h1><p>Tüm mağazalardaki tekstil ürünlerimiz</p></div>
<div class="search-wrap"><div class="search-box"><span class="search-icon">🔍</span><input type="text" id="searchInput" placeholder="Ürün adı, barkod veya kod ile ara..." oninput="filterProducts()"></div></div>
<div class="stats" id="statsBar" style="display:none;"><div class="stat"><div class="stat-val" id="totalProducts">0</div><div class="stat-lbl">Toplam Ürün</div></div><div class="stat"><div class="stat-val" id="avgPrice">₺0</div><div class="stat-lbl">Ort. Fiyat</div></div></div>
<div id="productList"><div class="loading"><div class="spinner"></div><span style="color:var(--text-muted);font-size:13px;">Ürünler yükleniyor...</span></div></div>
<script>
let allProducts=[];
document.addEventListener("DOMContentLoaded",async function(){
try{const r=await fetch("https://localhost:7232/api/Product/all");const products=await r.json();const c=document.getElementById("productList");if(!products||!products.length){c.innerHTML='<div class="empty"><div class="icon">📭</div><p>Ürün bulunamadı.</p></div>';return;}
allProducts=products;document.getElementById("totalProducts").textContent=products.length;const avg=products.reduce((s,p)=>s+(p.price||0),0)/products.length;document.getElementById("avgPrice").textContent="₺"+avg.toFixed(0);document.getElementById("statsBar").style.display="flex";document.getElementById("productCount").textContent=products.length+" ürün";renderProducts(products);}catch(e){console.error(e);document.getElementById("productList").innerHTML='<div class="empty"><div class="icon">❌</div><p>API bağlantı hatası.</p></div>';}});
function renderProducts(products){const c=document.getElementById("productList");c.innerHTML='';c.className='grid';products.forEach(p=>{const img=p.imageBase64?(p.imageBase64.startsWith('data:')?p.imageBase64:'data:image/png;base64,'+p.imageBase64):'';const d=document.createElement('div');d.className='card';d.innerHTML=`<div class="card-img">${img?`<img src="${img}" alt="${p.productProperties||''}" loading="lazy">`:'<span style="color:var(--text-muted);">Görsel Yok</span>'}</div><div class="card-name">${p.productProperties||"Ürün"}</div><div class="card-meta">Barkod: <span>${p.barcode||"-"}</span></div><div class="card-meta">Kod: <span>${p.productCode||"-"}</span></div><div class="card-price">₺${p.price?.toFixed(2)||"-"}</div>`;c.appendChild(d);});}
function filterProducts(){const q=document.getElementById("searchInput").value.toLowerCase().trim();if(!q){renderProducts(allProducts);return;}renderProducts(allProducts.filter(p=>(p.productProperties||'').toLowerCase().includes(q)||(p.barcode||'').toLowerCase().includes(q)||(p.productCode||'').toLowerCase().includes(q)));}
</script>
</body>
</html>
